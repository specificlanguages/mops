name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull request runs skip the test jobs when CI already passed for the tested git tree. docs/development.md describes
  # the `ci-passed-<tree>` cache entry and how to force a full run.
  tree-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      already-passed: ${{ steps.marker.outputs.cache-hit == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compute the tree hash of the tested commit
        id: tree
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "Tree: $tree" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Look up a passed marker for this tree
        id: marker
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ci-passed-marker
          key: ci-passed-${{ steps.tree.outputs.tree }}
          lookup-only: true

  mps-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read supportedMpsVersions from gradle.properties
        id: read
        run: |
          versions="$(sed -n 's/^supportedMpsVersions=//p' gradle.properties | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; ""))')"
          echo "$versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  verification:
    needs: tree-check
    if: needs.tree-check.outputs.already-passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Run unit tests and verification checks
        # The daemon-versions matrix runs the MPS-backed daemon tests, one job per supported MPS version.
        run: xvfb-run -a ./gradlew --continue check -x :cli:integrationTest -x :daemon:test -x :daemon:testOtherMpsVersions
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        if: ${{ !cancelled() }}
        with:
          prek-version: v0.5.9
          extra-args: --all-files
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-test-reports
          path: |
            */build/test-results/
            */build/reports/tests/

  daemon:
    needs: tree-check
    if: needs.tree-check.outputs.already-passed != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Test CLI smoke suite
        shell: bash
        run: ./gradlew --continue :cli:smokeTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daemon-test-reports-${{ matrix.os }}
          path: |
            cli/build/test-results/
            cli/build/reports/tests/

  daemon-versions:
    needs: [tree-check, mps-versions]
    if: needs.tree-check.outputs.already-passed != 'true'
    strategy:
      fail-fast: false
      matrix:
        mps: ${{ fromJSON(needs.mps-versions.outputs.versions) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Test daemon against MPS ${{ matrix.mps }}
        env:
          MPS_VERSION: ${{ matrix.mps }}
        run: xvfb-run -a ./gradlew --continue ":daemon:testMps${MPS_VERSION}"
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daemon-test-reports-mps-${{ matrix.mps }}
          path: |
            daemon/build/test-results/
            daemon/build/reports/tests/

  integration:
    needs: [tree-check, mps-versions]
    if: needs.tree-check.outputs.already-passed != 'true'
    strategy:
      fail-fast: false
      matrix:
        mps: ${{ fromJSON(needs.mps-versions.outputs.versions) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Test CLI against MPS ${{ matrix.mps }}
        env:
          MPS_VERSION: ${{ matrix.mps }}
        run: xvfb-run -a ./gradlew --continue ":cli:integrationTestMps${MPS_VERSION}"
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-integration-test-reports-mps-${{ matrix.mps }}
          path: |
            cli/build/test-results/
            cli/build/reports/tests/

  ci-passed:
    name: CI passed
    needs: [tree-check, mps-versions, verification, daemon, daemon-versions, integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all jobs to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          ALREADY_PASSED: ${{ needs.tree-check.outputs.already-passed }}
        run: |
          if [ "$ALREADY_PASSED" = true ]; then
            echo "CI already passed for this tree, the test jobs were skipped."
            echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
          else
            echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
          fi
      - name: Create the passed marker
        if: needs.tree-check.outputs.already-passed != 'true'
        run: touch ci-passed-marker
      - name: Save the passed marker for this tree
        if: needs.tree-check.outputs.already-passed != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ci-passed-marker
          key: ci-passed-${{ needs.tree-check.outputs.tree }}
