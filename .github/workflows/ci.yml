name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Picks the tier and the MPS versions of this run, and whether the test jobs can be skipped. docs/development.md
  # describes the tiers, the docs-only filter, and the `ci-passed-<tree>` cache entries.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      daemon-versions: ${{ steps.plan.outputs.daemon-versions }}
      integration-versions: ${{ steps.plan.outputs.integration-versions }}
      marker-key: ${{ steps.plan.outputs.marker-key }}
      already-passed: ${{ steps.full-marker.outputs.cache-hit == 'true' || steps.pr-marker.outputs.cache-hit == 'true' }}
      run-tests: >-
        ${{ steps.plan.outputs.docs-only != 'true' && steps.full-marker.outputs.cache-hit != 'true' &&
        steps.pr-marker.outputs.cache-hit != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Plan the run
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          versions="$(sed -n 's/^supportedMpsVersions=//p' gradle.properties | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; ""))')"
          docs_only=false
          if [ "$EVENT_NAME" = pull_request ]; then
            tier='pr'
            marker_key="ci-passed-pr-$tree"
            daemon_versions="$(jq -c 'map(select(. != "Prerelease")) | [first, last] | unique' <<< "$versions")"
            integration_versions="$(jq -c 'map(select(. != "Prerelease")) | [last]' <<< "$versions")"
            # HEAD is the merge commit of the pull request and HEAD^1 is the base branch.
            changed="$(git diff --name-only 'HEAD^1' HEAD)"
            if [ -n "$changed" ] && ! grep -qvE '^(docs/.+|[^/]+\.md)$' <<< "$changed"; then
              docs_only=true
            fi
          else
            tier='full'
            marker_key="ci-passed-$tree"
            daemon_versions="$versions"
            integration_versions="$versions"
          fi
          {
            echo "Tree: $tree"
            echo "Tier: $tier"
            echo "Docs only: $docs_only"
            echo "Daemon test versions: $daemon_versions"
            echo "Integration test versions: $integration_versions"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "tree=$tree"
            echo "tier=$tier"
            echo "docs-only=$docs_only"
            echo "marker-key=$marker_key"
            echo "daemon-versions=$daemon_versions"
            echo "integration-versions=$integration_versions"
          } >> "$GITHUB_OUTPUT"
      - name: Look up a full-tier passed marker for this tree
        id: full-marker
        if: steps.plan.outputs.tier == 'pr'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ci-passed-marker
          key: ci-passed-${{ steps.plan.outputs.tree }}
          lookup-only: true
      - name: Look up a pull request tier passed marker for this tree
        id: pr-marker
        if: steps.plan.outputs.tier == 'pr' && steps.full-marker.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ci-passed-marker
          key: ci-passed-pr-${{ steps.plan.outputs.tree }}
          lookup-only: true

  verification:
    needs: plan
    if: needs.plan.outputs.already-passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Run unit tests and verification checks
        # The daemon-versions matrix runs the MPS-backed daemon tests, one job per supported MPS version.
        run: xvfb-run -a ./gradlew --continue check -x :cli:integrationTest -x :daemon:test -x :daemon:testOtherMpsVersions
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        if: ${{ !cancelled() }}
        with:
          prek-version: v0.5.9
          extra-args: --all-files
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-test-reports
          path: |
            */build/test-results/
            */build/reports/tests/

  # Cross-platform smoke tests run only in the full tier.
  daemon:
    needs: plan
    if: needs.plan.outputs.tier == 'full' && needs.plan.outputs.run-tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Test CLI smoke suite
        shell: bash
        run: ./gradlew --continue :cli:smokeTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daemon-test-reports-${{ matrix.os }}
          path: |
            cli/build/test-results/
            cli/build/reports/tests/

  daemon-versions:
    needs: plan
    if: needs.plan.outputs.run-tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        mps: ${{ fromJSON(needs.plan.outputs.daemon-versions) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Test daemon against MPS ${{ matrix.mps }}
        env:
          MPS_VERSION: ${{ matrix.mps }}
        run: xvfb-run -a ./gradlew --continue ":daemon:testMps${MPS_VERSION}"
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daemon-test-reports-mps-${{ matrix.mps }}
          path: |
            daemon/build/test-results/
            daemon/build/reports/tests/

  integration:
    needs: plan
    if: needs.plan.outputs.run-tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        mps: ${{ fromJSON(needs.plan.outputs.integration-versions) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Test CLI against MPS ${{ matrix.mps }}
        env:
          MPS_VERSION: ${{ matrix.mps }}
        run: xvfb-run -a ./gradlew --continue ":cli:integrationTestMps${MPS_VERSION}"
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-integration-test-reports-mps-${{ matrix.mps }}
          path: |
            cli/build/test-results/
            cli/build/reports/tests/

  ci-passed:
    name: CI passed
    needs: [plan, verification, daemon, daemon-versions, integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The full tier skips no jobs. In the pull request tier, jobs are skipped only by their own conditions or after a
      # failed plan job, which this check rejects.
      - name: Require all jobs to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          TIER: ${{ needs.plan.outputs.tier }}
        run: |
          if [ "$TIER" = full ]; then
            echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
          else
            echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
          fi
      - name: Create the passed marker
        if: needs.plan.outputs.run-tests == 'true'
        run: touch ci-passed-marker
      - name: Save the passed marker for this tree
        if: needs.plan.outputs.run-tests == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ci-passed-marker
          key: ${{ needs.plan.outputs.marker-key }}
