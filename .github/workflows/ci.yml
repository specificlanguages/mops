name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Each push to main gets its own group: the next push compares with its head, so a cancelled push would leave its changes
# untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Picks the tier, the MPS versions, and the test shards of this run, and whether the test jobs can be skipped.
  # docs/ci.md describes the tiers, the shards, the docs-only filter, and the `ci-passed-<tree>` cache entries.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      docs-only: ${{ steps.plan.outputs.docs-only }}
      daemon-jobs: ${{ steps.plan.outputs.daemon-jobs }}
      integration-jobs: ${{ steps.plan.outputs.integration-jobs }}
      marker-key: ${{ steps.plan.outputs.marker-key }}
      already-passed: ${{ steps.full-marker.outputs.cache-hit == 'true' || steps.pr-marker.outputs.cache-hit == 'true' }}
      run-tests: >-
        ${{ steps.plan.outputs.docs-only != 'true' && steps.full-marker.outputs.cache-hit != 'true' &&
        steps.pr-marker.outputs.cache-hit != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Plan the run
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          BASE_SHA: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
        run: |
          plan="$(.github/scripts/plan.sh)"
          echo "$plan" >> "$GITHUB_OUTPUT"
          printf "\`\`\`text\n%s\n\`\`\`\n" "$plan" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Look up a full-tier passed marker for this tree
        id: full-marker
        if: steps.plan.outputs.tier == 'pr'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ci-passed-marker
          key: ci-passed-${{ steps.plan.outputs.tree }}
          lookup-only: true
      - name: Look up a pull request tier passed marker for this tree
        id: pr-marker
        if: steps.plan.outputs.tier == 'pr' && steps.full-marker.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ci-passed-marker
          key: ci-passed-pr-${{ steps.plan.outputs.tree }}
          lookup-only: true

  # A docs-only run skips the Gradle steps and runs only the prek hooks.
  verification:
    needs: plan
    if: needs.plan.outputs.already-passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        if: needs.plan.outputs.docs-only != 'true'
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        if: needs.plan.outputs.docs-only != 'true'
      - name: Run unit tests and verification checks
        if: needs.plan.outputs.docs-only != 'true'
        # The daemon-versions matrix runs the MPS-backed daemon tests.
        run: xvfb-run -a ./gradlew --continue check -x :cli:integrationTest -x :daemon:test -x :daemon:testOtherMpsVersions
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        if: ${{ !cancelled() }}
        with:
          prek-version: v0.5.9
          extra-args: --all-files
      - name: Upload test reports
        if: ${{ !cancelled() && needs.plan.outputs.docs-only != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-test-reports
          path: |
            */build/test-results/
            */build/reports/tests/

  # Cross-platform smoke tests run only in the full tier.
  daemon:
    needs: plan
    if: needs.plan.outputs.tier == 'full' && needs.plan.outputs.run-tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Test CLI smoke suite
        shell: bash
        run: ./gradlew --continue :cli:smokeTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daemon-test-reports-${{ matrix.os }}
          path: |
            cli/build/test-results/
            cli/build/reports/tests/

  # The matrix entries name an MPS version and one of the shards of its tests; see the `shards` function in plan.sh.
  daemon-versions:
    name: >-
      daemon-versions (${{ matrix.mps }}${{ matrix.shards > 1 && format(', {0}/{1}', matrix.shard, matrix.shards) || '' }})
    needs: plan
    if: needs.plan.outputs.run-tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.daemon-jobs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Test daemon against MPS ${{ matrix.mps }}
        env:
          MPS_VERSION: ${{ matrix.mps }}
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: xvfb-run -a ./gradlew --continue ":daemon:testMps${MPS_VERSION}" "-PtestShard=${SHARD}"
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daemon-test-reports-mps-${{ matrix.mps }}-shard-${{ matrix.shard }}-of-${{ matrix.shards }}
          path: |
            daemon/build/test-results/
            daemon/build/reports/tests/

  integration:
    name: >-
      integration (${{ matrix.mps }}${{ matrix.shards > 1 && format(', {0}/{1}', matrix.shard, matrix.shards) || '' }})
    needs: plan
    if: needs.plan.outputs.run-tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.integration-jobs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Test CLI against MPS ${{ matrix.mps }}
        env:
          MPS_VERSION: ${{ matrix.mps }}
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: xvfb-run -a ./gradlew --continue ":cli:integrationTestMps${MPS_VERSION}" "-PtestShard=${SHARD}"
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-integration-test-reports-mps-${{ matrix.mps }}-shard-${{ matrix.shard }}-of-${{ matrix.shards }}
          path: |
            cli/build/test-results/
            cli/build/reports/tests/

  ci-passed:
    name: CI passed
    needs: [plan, verification, daemon, daemon-versions, integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Jobs are skipped only by their own conditions or after a failed plan job, which this check rejects.
      - name: Require all jobs to succeed or be skipped by the plan
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
      - name: Create the passed marker
        if: needs.plan.outputs.run-tests == 'true' && needs.plan.outputs.marker-key != ''
        run: touch ci-passed-marker
      - name: Save the passed marker for this tree
        if: needs.plan.outputs.run-tests == 'true' && needs.plan.outputs.marker-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ci-passed-marker
          key: ${{ needs.plan.outputs.marker-key }}
