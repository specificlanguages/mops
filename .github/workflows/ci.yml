name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Run unit tests and verification checks
        # The daemon-versions matrix runs the MPS-backed daemon tests, one job per supported MPS version.
        run: xvfb-run -a ./gradlew --continue check -x :cli:integrationTest -x :daemon:test -x :daemon:testOtherMpsVersions
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        if: ${{ !cancelled() }}
        with:
          prek-version: v0.5.9
          extra-args: --all-files
      - name: Check the MPS version matrices list the supported MPS versions
        if: ${{ !cancelled() }}
        run: |
          expected="$(sed -n 's/^supportedMpsVersions=//p' gradle.properties | tr -d ' ')"
          for job in integration daemon-versions; do
            actual="$(yq -r ".jobs.\"$job\".strategy.matrix.mps | join(\",\")" .github/workflows/ci.yml)"
            if [[ "$actual" != "$expected" ]]; then
              echo "ci.yml $job matrix is [$actual], gradle.properties supportedMpsVersions is [$expected]" >&2
              exit 1
            fi
          done
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-test-reports
          path: |
            */build/test-results/
            */build/reports/tests/

  daemon:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Test CLI smoke suite
        shell: bash
        run: ./gradlew --continue :cli:smokeTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daemon-test-reports-${{ matrix.os }}
          path: |
            cli/build/test-results/
            cli/build/reports/tests/

  daemon-versions:
    strategy:
      fail-fast: false
      matrix:
        mps: ["2024.1.6", "2025.1.4", "2026.1.1"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Test daemon against MPS ${{ matrix.mps }}
        env:
          MPS_VERSION: ${{ matrix.mps }}
        run: xvfb-run -a ./gradlew --continue ":daemon:testMps${MPS_VERSION}"
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daemon-test-reports-mps-${{ matrix.mps }}
          path: |
            daemon/build/test-results/
            daemon/build/reports/tests/

  integration:
    strategy:
      fail-fast: false
      matrix:
        mps: ["2024.1.6", "2025.1.4", "2026.1.1"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Test CLI against MPS ${{ matrix.mps }}
        env:
          MPS_VERSION: ${{ matrix.mps }}
        run: xvfb-run -a ./gradlew --continue ":cli:integrationTestMps${MPS_VERSION}"
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-integration-test-reports-mps-${{ matrix.mps }}
          path: |
            cli/build/test-results/
            cli/build/reports/tests/

  ci-passed:
    name: CI passed
    needs: [verification, daemon, daemon-versions, integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all jobs to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
