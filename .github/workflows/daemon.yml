name: Daemon lifecycle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daemon:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Test daemon lifecycle
        shell: bash
        run: >-
          ./gradlew :cli:test --tests '*DaemonStatusStopCommandTest' --tests '*FullClasspathDaemonLauncherTest'
          :cli:integrationTest --tests '*DaemonControlIntegrationTest' --tests '*DaemonStartupIntegrationTest'
