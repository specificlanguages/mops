name: Daemon lifecycle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daemon:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Test daemon lifecycle
        shell: bash
        run: >-
          ./gradlew --continue :cli:test --tests '*DaemonStatusStopCommandTest' --tests '*FullClasspathDaemonLauncherTest'
          :cli:integrationTestMps2026.1.1 --tests '*DaemonControlIntegrationTest' --tests '*DaemonStartupIntegrationTest'
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: daemon-test-reports-${{ matrix.os }}
          path: |
            cli/build/test-results/
            cli/build/reports/tests/

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Test CLI against all supported MPS versions
        run: ./gradlew --continue :cli:integrationTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cli-integration-test-reports
          path: |
            cli/build/test-results/
            cli/build/reports/tests/
