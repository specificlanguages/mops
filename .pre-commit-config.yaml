default_install_hook_types:
  - pre-commit

repos:
  # Manual stage: git hooks never run it. The Pull request title workflow runs it on the pull request title.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages:
          - manual
        args:
          - --verbose

  - repo: local
    hooks:
      - id: prettier
        name: Format Markdown with Prettier
        entry: prettier --write
        language: node
        additional_dependencies:
          - prettier@3.9.7
        types:
          - markdown

      - id: markdownlint-cli2
        name: Lint Markdown with markdownlint-cli2
        entry: markdownlint-cli2
        language: node
        additional_dependencies:
          - markdownlint-cli2@0.23.2
        types:
          - markdown

      # A change to the markdownlint configuration or custom rules can affect every Markdown file.
      - id: markdownlint-cli2-all
        name: Lint all Markdown with markdownlint-cli2
        entry: sh -c 'git ls-files -z -- "*.md" | xargs -0 markdownlint-cli2'
        language: node
        additional_dependencies:
          - markdownlint-cli2@0.23.2
        files: ^(tools/markdownlint/|\.markdownlint-cli2\.yaml$)
        pass_filenames: false

      - id: markdownlint-rules-test
        name: Test markdownlint custom rules
        entry: node --test tools/markdownlint/
        language: node
        # Keep in step with the markdownlint version that markdownlint-cli2 above depends on.
        additional_dependencies:
          - markdownlint@0.41.1
        files: ^(tools/markdownlint/|\.pre-commit-config\.yaml$)
        pass_filenames: false

      - id: file-size
        name: Check Kotlin and Markdown file size
        entry: tools/pre-commit/check-file-size.py
        language: python
        files: \.(kt|md)$
        # Files that were over the limit when the check was introduced. Remove a file from this list after splitting it.
        exclude: |
          (?x)^(
            README\.md|
            cli/src/test/kotlin/com/specificlanguages/mops/cli/FindInstancesCommandTest\.kt|
            daemon/src/main/kotlin/com/specificlanguages/mops/daemon/EditBatchExecutor\.kt|
            daemon/src/main/kotlin/com/specificlanguages/mops/daemon/JetBrainsMpsAccess\.kt|
            daemon/src/main/kotlin/com/specificlanguages/mops/daemon/ModuleLoadDiagnostics\.kt|
            daemon/src/test/kotlin/com/specificlanguages/mops/daemon/FindInstancesSemanticsTest\.kt|
            daemon/src/test/kotlin/com/specificlanguages/mops/daemon/MpsListSemanticsTest\.kt|
            protocol/src/test/kotlin/com/specificlanguages/mops/protocol/DaemonProtocolJsonTest\.kt
          )$

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        files: ^\.github/workflows/[^/]+\.ya?ml$

  - repo: https://github.com/agent-ecosystem/skill-validator
    rev: v1.6.0
    hooks:
      - id: skill-validator
        args:
          - validate
          - structure
          - --strict
          - skills/
        files: ^skills/
