repos:
  - repo: local
    hooks:
      - id: prettier
        name: Format Markdown with Prettier
        entry: prettier --write
        language: node
        additional_dependencies:
          - prettier@3.9.7
        types:
          - markdown

      - id: markdownlint-cli2
        name: Lint Markdown with markdownlint-cli2
        entry: markdownlint-cli2
        language: node
        additional_dependencies:
          - markdownlint-cli2@0.23.2
        types:
          - markdown

  - repo: https://github.com/agent-ecosystem/skill-validator
    rev: v1.6.0
    hooks:
      - id: skill-validator
        args:
          - validate
          - structure
          - --strict
          - skills/
        files: ^skills/
