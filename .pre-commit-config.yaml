default_install_hook_types:
  - pre-commit

repos:
  # Manual stage: git hooks never run it. The Pull request title workflow runs it on the pull request title.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages:
          - manual
        args:
          - --verbose

  - repo: local
    hooks:
      - id: prettier
        name: Format Markdown with Prettier
        entry: prettier --write
        language: node
        additional_dependencies:
          - prettier@3.9.7
        types:
          - markdown

      - id: markdownlint-cli2
        name: Lint Markdown with markdownlint-cli2
        entry: markdownlint-cli2
        language: node
        additional_dependencies:
          - markdownlint-cli2@0.23.2
        types:
          - markdown

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        files: ^\.github/workflows/[^/]+\.ya?ml$

  - repo: https://github.com/agent-ecosystem/skill-validator
    rev: v1.6.0
    hooks:
      - id: skill-validator
        args:
          - validate
          - structure
          - --strict
          - skills/
        files: ^skills/
