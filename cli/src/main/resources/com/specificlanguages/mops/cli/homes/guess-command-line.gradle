import groovy.json.JsonOutput

// Keep the init script out of buildSrc and included builds.
gradle.projectsEvaluated {
    if (gradle.parent != null || gradle.rootProject.projectDir.canonicalPath != System.getProperty('mops.guess.root')) {
        return
    }
    gradle.rootProject.tasks.register(System.getProperty('mops.guess.task')) {
        doLast {
            def projects = gradle.rootProject.allprojects.collect { project ->
                def source = null
                def mpsHome = null
                def javaHome = null
                def mpsProjectRoots = []
                def defaults = project.extensions.findByName('mpsDefaults')
                if (defaults != null) {
                    source = "${project.path} mpsDefaults (com.specificlanguages.mps 2.x)"
                    mpsHome = defaults.mpsHome.orNull?.asFile?.canonicalPath
                    javaHome = defaults.javaLauncher.orNull?.metadata?.installationPath?.asFile?.canonicalPath
                    mpsProjectRoots = project.extensions.findByName('mpsBuilds')?.collect {
                        it.mpsProjectDirectory.orNull?.asFile?.canonicalPath
                    }?.findAll { it != null }?.unique() ?: []
                } else {
                    def task = project.tasks.find { task ->
                        def type = task.class
                        while (type != null && type.name != 'de.itemis.mps.gradle.RunAntScript') {
                            type = type.superclass
                        }
                        type != null
                    }
                    if (task != null) {
                        def args = task.scriptArgs.toList()
                        if (task.includeDefaultArgs) {
                            args.addAll(project.findProperty('itemis.mps.gradle.ant.defaultScriptArgs') ?: [])
                        }
                        def mpsArgument = args.find {
                            it.startsWith('-Dmps.home=') || it.startsWith('-Dmps_home=')
                        }
                        def executable = task.executable ?:
                            project.findProperty('itemis.mps.gradle.ant.defaultJavaExecutable')
                        source = "${task.path} (mbeddr RunAntScript)"
                        if (executable == null) {
                            executable = new File(System.getProperty('java.home'), 'bin/java')
                            source += '; Gradle default Java'
                        }
                        mpsHome = mpsArgument == null ? null :
                            project.file(mpsArgument.substring(mpsArgument.indexOf('=') + 1)).canonicalPath
                        javaHome = project.file(executable.toString()).absoluteFile.parentFile.parentFile.canonicalPath
                    }
                }
                [
                    projectDir: project.projectDir.canonicalPath,
                    buildDir: project.layout.buildDirectory.get().asFile.canonicalPath,
                    source: source,
                    mpsHome: mpsHome,
                    javaHome: javaHome,
                    mpsProjectRoots: mpsProjectRoots,
                ]
            }
            new File(System.getProperty('mops.guess.output')).setText(
                JsonOutput.toJson([version: 2, projects: projects]), 'UTF-8')
        }
    }
}
