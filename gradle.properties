# Release commits set this to the exact release version; development commits use the next -SNAPSHOT version.
version=0.4.0-SNAPSHOT

# MPS versions exercised by the daemon and CLI integration-test matrices, locally and in CI. The Prerelease entry stands
# for the mps-prerelease version in gradle/libs.versions.toml, which Renovate keeps current.
# Prerelease builds are deleted from the repository a few weeks after publishing.
supportedMpsVersions=2024.1.6,2025.1.4,2026.1.1,Prerelease
