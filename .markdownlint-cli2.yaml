config:
  MD013:
    line_length: 120
    code_blocks: false
    tables: false
  paragraph-length:
    max_words: 150
customRules:
  - ./tools/markdownlint/paragraph-length.cjs
gitignore: true
# Agent worktrees are often ignored only by a global Git ignore file, which the gitignore option does not read.
ignores:
  - .claude/worktrees/**
