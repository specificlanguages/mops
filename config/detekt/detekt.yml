# Only the complexity and exceptions rule sets are active. Every other rule set is turned off, so detekt reports method
# length, complexity, nesting, parameter count, class and file size, and exception handling, and nothing about style or
# naming.
# See "Code structure checks" in docs/development.md for how the per-module baselines work.

complexity:
  active: true
  CognitiveComplexMethod:
    active: true
  # `when` entries without a block of their own do not count toward cyclomatic complexity.
  CyclomaticComplexMethod:
    ignoreSimpleWhenEntries: true
  # Only non-private functions count toward a class's function limit. Implementations of facade interfaces such as
  # MpsRead are not flagged for the functions they override.
  TooManyFunctions:
    ignorePrivate: true
    ignoreOverridden: true
    # Facades grow with every operation they offer. See com.specificlanguages.mops.protocol.Facade.
    ignoreAnnotated:
      - 'Facade'

comments:
  active: false
coroutines:
  active: false
empty-blocks:
  active: false
exceptions:
  active: true
  PrintStackTrace:
    active: true
    ignoreFunction: ["main(kotlin.Array)"] # Allow printing stack traces in main() only
  TooGenericExceptionCaught:
    active: false
naming:
  active: false
performance:
  active: false
potential-bugs:
  active: false
style:
  active: false
